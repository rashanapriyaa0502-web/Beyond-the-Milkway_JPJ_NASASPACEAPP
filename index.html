<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>
            Beyond the Milkway
        </title>
        <link rel="icon" href="data:,">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        >
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Unbounded:wght@600;800&display=swap">
        <style>
            :root {
                --fd:"Unbounded","Trebuchet MS","Segoe UI",system-ui,sans-serif;
                --fb:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
                --bg:#e9efff;
                --fg:#0a1a5e;
                --card:#fbfcff;
                --mut:#4b5b9c;
                --ln:#a3b4ea;
                --a1:#ffcc00;
                --a2:#c4202a;
                --a3:#0b7a3e;
                --a4:#ff9e3d;
                --lk:#1a3cc0;
                --br:#0a1a5e;
                --pri:#ffcc00;
                --pri-d:#b58f00;
                --onpri:#0a1a5e;
                --grid:#0a1a5e14;
                box-sizing:border-box;
                padding-top:env(safe-area-inset-top,0px);
                padding-bottom:env(safe-area-inset-bottom,0px)
            }
            @media(prefers-color-scheme:dark) {
                :root:not([data-theme="light"]) {
                    --bg:#0b1d66;
                    --fg:#f1f5ff;
                    --card:#081649;
                    --mut:#a9b9ec;
                    --ln:#3b55b8;
                    --a2:#ff7b72;
                    --a3:#7ff0b0;
                    --lk:#ffd966;
                    --br:#ffcc00;
                    --grid:#9db4ff16
                }
            }
            :root[data-theme="dark"] {
                --bg:#0b1d66;
                --fg:#f1f5ff;
                --card:#081649;
                --mut:#a9b9ec;
                --ln:#3b55b8;
                --a2:#ff7b72;
                --a3:#7ff0b0;
                --lk:#ffd966;
                --br:#ffcc00;
                --grid:#9db4ff16
            }
            * {
                box-sizing:border-box
            }
            html,body {
                margin:0
            }
            body {
                background-color:var(--bg);
                background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
                background-size:28px 28px;
                background-attachment:fixed;
                color:var(--fg);
                font:16px/1.55 var(--fb);
                min-height:100dvh
            }
            h1,h2,h3 {
                font-family:var(--fd);
                font-weight:800;
                letter-spacing:-.01em;
                line-height:1.15
            }
            :focus-visible {
                outline:3px solid var(--a1);
                outline-offset:2px
            }
            .w {
                max-width:1100px;
                margin:auto;
                padding:12px;
                display:flex;
                flex-direction:column;
                gap:12px;
                min-height:100dvh
            }
            .top {
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:8px
            }
            .top b.brand {
                display:flex;
                align-items:center;
                gap:8px;
                font-family:var(--fd);
                font-weight:800;
                font-size:.95rem;
                letter-spacing:0
            }
            .c {
                position:relative;
                background:var(--card);
                border:1.5px solid var(--ln);
                border-radius:6px;
                padding:18px
            }
            .c::before,.c::after {
                content:"";
                position:absolute;
                width:16px;
                height:16px;
                pointer-events:none;
                border:0 solid var(--br)
            }
            .c::before {
                top:-2px;
                left:-2px;
                border-width:3px 0 0 3px;
                border-top-left-radius:6px
            }
            .c::after {
                right:-2px;
                bottom:-2px;
                border-width:0 3px 3px 0;
                border-bottom-right-radius:6px
            }
            .g {
                font-size:clamp(2.6rem,9vw,5.2rem);
                margin:0 0 .3em;
                line-height:.98;
                letter-spacing:-.03em;
                color:var(--fg)
            }
            .m {
                color:var(--mut)
            }
            @keyframes dr {
                to {
                    stroke-dashoffset:0
                }
            }
            .hero {
                display:grid;
                gap:24px;
                align-items:center;
                margin:auto 0;
                padding:28px
            }
            @media(min-width:760px) {
                .hero {
                    grid-template-columns:1.15fr .85fr;
                    padding:40px
                }
            }
            .hero p {
                max-width:34ch;
                margin:.4em 0
            }
            .hero .tag {
                font-size:1.25rem;
                font-weight:700
            }
            .emb {
                width:100%;
                max-width:300px;
                justify-self:center;
                color:var(--fg)
            }
            .emb .tr {
                stroke-dasharray:420;
                stroke-dashoffset:420;
                animation:dr 2.2s ease-out .4s forwards
            }
            .b {
                border:0;
                border-radius:10px;
                padding:11px 18px;
                font:inherit;
                font-weight:700;
                cursor:pointer;
                color:var(--onpri);
                background:var(--pri);
                box-shadow:0 4px 0 var(--pri-d);
                transition:transform .08s,box-shadow .08s,filter .15s
            }
            .b:hover:not(:disabled) {
                filter:brightness(1.07)
            }
            .b:active:not(:disabled) {
                transform:translateY(3px);
                box-shadow:0 1px 0 var(--pri-d)
            }
            .b.alt {
                background:transparent;
                color:var(--fg);
                border:1.5px solid var(--ln);
                box-shadow:0 3px 0 var(--ln)
            }
            .b.alt:hover:not(:disabled) {
                background:color-mix(in srgb,var(--fg) 8%,transparent)
            }
            .b.alt:active:not(:disabled) {
                box-shadow:0 0 0 var(--ln)
            }
            .b:disabled {
                opacity:.4;
                cursor:not-allowed;
                box-shadow:none
            }
            .b.s {
                padding:6px 10px;
                font-size:.85rem
            }
            .chip {
                display:inline-block;
                padding:7px 12px;
                margin:3px;
                border-radius:999px;
                border:1.5px solid var(--ln);
                background:transparent;
                cursor:pointer;
                user-select:none;
                transition:background .12s
            }
            .chip:hover {
                background:color-mix(in srgb,var(--fg) 8%,transparent)
            }
            .chip.on {
                background:var(--a1);
                color:#0a1a5e;
                border-color:var(--a1);
                font-weight:700
            }
            .chip.lock {
                opacity:.55;
                border-style:dashed
            }
            input {
                font:inherit;
                padding:10px 12px;
                border-radius:6px;
                border:1.5px solid var(--ln);
                background:var(--bg);
                color:var(--fg);
                width:100%;
                margin:4px 0
            }
            .nav {
                display:flex;
                justify-content:space-between;
                gap:8px;
                margin-top:auto
            }
            .bar {
                position:relative;
                height:12px;
                background:var(--ln);
                border-radius:3px;
                overflow:hidden
            }
            .bar i {
                display:block;
                height:100%;
                background:var(--a1)
            }
            .bar::after {
                content:"";
                position:absolute;
                inset:0;
                background:repeating-linear-gradient(90deg,transparent 0 calc(20% - 3px),var(--card) calc(20% - 3px) 20%)
            }
            .hub {
                display:grid;
                gap:12px;
                grid-template-columns:1fr
            }
            @media(min-width:900px) {
                .hub {
                    grid-template-columns:1.5fr 1fr
                }
            }
            .row {
                display:grid;
                grid-template-columns:90px 1fr auto;
                gap:8px;
                align-items:center;
                margin:6px 0
            }
            .ages {
                display:grid;
                gap:10px;
                grid-template-columns:repeat(auto-fit,minmax(140px,1fr))
            }
            .ages .c {
                cursor:pointer;
                text-align:center
            }
            .ages .c.on {
                border-color:var(--a1);
                box-shadow:0 0 0 3px var(--a1)
            }
            canvas {
                width:100%;
                height:clamp(260px,52vh,560px);
                display:block;
                border-radius:4px;
                border:1.5px solid var(--ln);
                background:#06134f;
                touch-action:none
            }
            .zb {
                position:absolute;
                right:10px;
                bottom:10px;
                display:flex;
                gap:6px
            }
            .ov {
                position:fixed;
                inset:0;
                background:#030a35cc;
                display:grid;
                place-items:center;
                padding:16px;
                z-index:9
            }
            .ov .c {
                max-width:420px;
                width:100%
            }
            pre {
                overflow-x:auto;
                background:var(--bg);
                padding:8px;
                border-radius:6px;
                font-size:.78rem
            }
            .ok {
                color:var(--a3)
            }
            .no {
                color:var(--a2)
            }
            a {
                color:var(--lk)
            }
            @media(prefers-reduced-motion:reduce) {
                * {
                    animation-duration:.01ms!important;
                    animation-iteration-count:1!important;
                    transition-duration:.01ms!important
                }
                .emb .tr {
                    stroke-dashoffset:0
                }
            }
            #sp {
                position:fixed;
                inset:0;
                z-index:99;
                background:radial-gradient(circle at 50% 40%,#10163f,#000 72%);
                display:grid;
                place-items:center;
                overflow:hidden;
                transition:opacity .55s
            }
            #sp.out {
                opacity:0;
                pointer-events:none
            }
            #spg {
                color:#cfd6ff;
                letter-spacing:.35em;
                font-weight:700;
                cursor:pointer;
                padding:30px;
                text-align:center;
                animation:pl 1.4s ease-in-out infinite
            }
            @keyframes pl {
                50% {
                    opacity:.35
                }
            }
            #spl {
                display:none;
                position:relative;
                width:100%;
                height:100%;
                place-items:center
            }
            #sp.go #spg {
                display:none
            }
            #sp.go #spl {
                display:grid
            }
            #spw {
                display:flex;
                flex-direction:column;
                align-items:center;
                gap:12px;
                position:relative;
                animation:sf 3.2s ease-in-out 1.9s infinite
            }
            @keyframes sf {
                50% {
                    transform:translateY(-8px)
                }
            }
            .cap {
                opacity:0;
                color:#cfd6ff;
                letter-spacing:.4em;
                font-size:.8rem;
                font-weight:700
            }
            #sp.go .cap {
                animation:fi .7s ease-out 1.6s forwards
            }
            @keyframes fi {
                to {
                    opacity:1
                }
            }
            #spi {
                width:min(92vw,820px);
                max-height:76dvh;
                object-fit:contain;
                border-radius:22px;
                opacity:0;
                box-shadow:0 0 0 3px #ffcc00,0 0 50px #ffcc0088,0 0 120px #3f6bff
            }
            #sp.go #spi {
                animation:pop 1s cubic-bezier(.2,1.3,.4,1) .9s forwards,gl 2.4s ease-in-out 1.9s infinite
            }
            @keyframes pop {
                0% {
                    opacity:0;
                    transform:scale(.05) rotate(-10deg);
                    filter:blur(14px) brightness(2.4)
                }
                55% {
                    opacity:1;
                    transform:scale(1.16) rotate(2deg);
                    filter:blur(0) brightness(1.5)
                }
                100% {
                    opacity:1;
                    transform:scale(1) rotate(0);
                    filter:blur(0) brightness(1)
                }
            }
            @keyframes gl {
                50% {
                    box-shadow:0 0 0 3px #ffd54a,0 0 80px #ffcc00aa,0 0 180px #3f6bff
                }
            }
            .ring {
                position:absolute;
                left:50%;
                top:50%;
                width:60vmin;
                height:60vmin;
                margin:-30vmin 0 0 -30vmin;
                border:5px solid #ffcc00;
                border-radius:50%;
                opacity:0;
                pointer-events:none
            }
            #sp.go .ring {
                animation:rg 1.2s ease-out .9s forwards
            }
            #sp.go .ring.r2 {
                border-color:#fff;
                animation-delay:1.05s
            }
            @keyframes rg {
                0% {
                    opacity:.95;
                    transform:scale(.05)
                }
                100% {
                    opacity:0;
                    transform:scale(2.6)
                }
            }
            .spk {
                position:absolute;
                left:50%;
                top:50%;
                width:10px;
                height:10px;
                margin:-5px;
                border-radius:50%;
                opacity:0;
                pointer-events:none
            }
            #sp.go .spk {
                animation:sk 1.2s ease-out .9s forwards
            }
            @keyframes sk {
                0% {
                    opacity:1;
                    transform:translate(0,0) scale(1)
                }
                100% {
                    opacity:0;
                    transform:translate(var(--dx),var(--dy)) scale(.2)
                }
            }
            #sps {
                position:absolute;
                right:14px;
                bottom:calc(14px + env(safe-area-inset-bottom,0px));
                opacity:.6
            }
            .tin {
                animation:tin .9s cubic-bezier(.2,1.3,.4,1)
            }
            @keyframes tin {
                0% {
                    opacity:0;
                    transform:scale(.7)
                }
                100% {
                    opacity:1;
                    transform:scale(1)
                }
            }
            .ov .c.wide {
                max-width:680px;
                max-height:88dvh;
                overflow:auto
            }
            .ov h4 {
                margin:14px 0 4px
            }
            .ov ul,.ov ol {
                margin:4px 0;
                padding-left:20px
            }
            .ov li {
                margin:3px 0
            }
            .qo {
                display:block;
                width:100%;
                text-align:left;
                margin:5px 0
            }
            #toast {
                position:fixed;
                left:50%;
                top:calc(62px + env(safe-area-inset-top,0px));
                transform:translateX(-50%) translateY(-14px);
                opacity:0;
                pointer-events:none;
                z-index:30;
                background:var(--card);
                color:var(--fg);
                border:2px solid var(--a1);
                border-radius:16px;
                padding:10px 14px;
                display:flex;
                gap:10px;
                align-items:center;
                max-width:min(94vw,520px);
                box-shadow:0 8px 28px #000a;
                transition:opacity .25s,transform .25s
            }
            #toast.on {
                opacity:1;
                pointer-events:auto;
                transform:translateX(-50%)
            }
            .tdots {
                display:flex;
                gap:6px;
                justify-content:center;
                margin:14px 0
            }
            .tdots i {
                width:9px;
                height:9px;
                border-radius:50%;
                background:var(--ln)
            }
            .tdots i.on {
                background:var(--a1);
                transform:scale(1.25)
            }
            .tc {
                max-height:88dvh;
                overflow:auto
            }
            .tc p {
                font-size:1.02rem
            }
        </style>
    </head>
    <body>
        <div class="w">
            <div class="top">
                <b class="brand">
                    <svg
                        width="24"
                        height="24"
                        viewbox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="9"/>
                        <circle cx="12" cy="12" r="3.2" fill="#ffcc00" stroke="none"/>
                        <circle cx="19.5" cy="7" r="2.2" fill="currentColor" stroke="none"/>
                    </svg>
                    Beyond the Milkway
                </b>
                <span id="cr">
                </span>
                <span style="display:flex;gap:6px">
                    <button
                        class="b alt s"
                        id="endb"
                        title="End / New game"
                        aria-label="End / New game"
                        onclick="S.en=1;render()"
                    >
                        🏁
                    </button>
                    <button
                        class="b alt s"
                        id="tutb"
                        title="Tutorial"
                        aria-label="Tutorial"
                        onclick="S.tg=1;S.tp=0;render()"
                    >
                        🎓
                    </button>
                    <button
                        class="b alt s"
                        id="inf"
                        onclick="S.info=1;render()"
                    >
                        📚
                    </button>
                    <button
                        class="b alt s"
                        id="gear"
                        onclick="S.set=1;render()"
                    >
                        ⚙
                    </button>
                </span>
            </div>
            <div id="app" style="display:flex;flex-direction:column;gap:12px;flex:1">
            </div>
        </div>
        <div
            id="toast"
            role="status"
            aria-live="polite"
        >
        </div>
        <canvas id="fl" style="position:fixed;inset:0;width:100%;height:100%;z-index:8;display:none;border:0;border-radius:0;touch-action:none">
        </canvas>
        <button
            class="b alt s"
            id="flx"
            style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;background:#030a35cc;color:#fff"
            onclick="undo()"
        >
        </button>

                body: [
                    [`<p><b>Beyond the Milkway</b> is a mission-planning game: pick a world, upgrade your ship, pay the trip cost and launch. Hazards, budget and fuel (Δv) decide if you succeed.</p><h4>How to play</h4><ol><li>Add 1–4 crew and choose your age group and difficulty.</li><li>Upgrade Shield, Heat shield, Power and Drive with 💰.</li><li>Pick a planet. Green ✔ needs mean your ship is ready; red ✖ means upgrade first.</li><li>Launch, handle the random event as a team, then read the mission report.</li><li>Finish a tier to unlock the next one, up to the Proxima b epilogue.</li></ol><h4>Built with</h4><p>One self-contained HTML file (HTML, CSS, JavaScript). The orrery is drawn on canvas, sound is made live with the Web Audio API, and it has English / Bahasa Melayu / 中文, three age levels and a VR split-view mode. It works offline.</p>`,
                        `<p><b>Beyond the Milkway</b> ialah permainan perancangan misi: pilih dunia, naik taraf kapal anda, bayar kos perjalanan dan lancarkan. Bahaya, bajet dan bahan api (Δv) menentukan kejayaan anda.</p><h4>Cara bermain</h4><ol><li>Tambah 1–4 kru dan pilih kumpulan umur serta kesukaran.</li><li>Naik taraf Perisai, Perisai haba, Kuasa dan Enjin dengan 💰.</li><li>Pilih planet. ✔ hijau bermakna kapal sedia; ✖ merah bermakna naik taraf dahulu.</li><li>Lancarkan, uruskan kejadian rawak bersama pasukan, kemudian baca laporan misi.</li><li>Selesaikan satu tahap untuk membuka yang seterusnya, hingga epilog Proxima b.</li></ol><h4>Dibina dengan</h4><p>Satu fail HTML sendiri (HTML, CSS, JavaScript). Orrery dilukis pada canvas, bunyi dijana terus dengan Web Audio API, serta English / Bahasa Melayu / 中文, tiga tahap umur dan mod VR paparan dua. Berfungsi tanpa internet.</p>`,
                        `<p><b>Beyond the Milkway</b> 是一款任务规划游戏：选择星球、升级飞船、支付旅费并发射。危险、预算和燃料（Δv）决定成败。</p><h4>玩法</h4><ol><li>添加1–4名队员，选择年龄段和难度。</li><li>用💰升级护盾、隔热、能源和动力。</li><li>选择星球。绿色 ✔ 表示准备就绪，红色 ✖ 表示需先升级。</li><li>发射后与队友一起处理随机事件，然后查看任务报告。</li><li>完成一个等级即可解锁下一级，直至比邻星b终章。</li></ol><h4>技术</h4><p>单个独立 HTML 文件（HTML、CSS、JavaScript）。轨道图用 canvas 绘制，声音由 Web Audio API 实时生成，支持英文 / 马来文 / 中文、三个年龄层和 VR 分屏模式。无需网络即可运行。</p>`],
                    [`<h4>Δv and Hohmann transfers</h4><p>Δv is the “speed change” a rocket must buy with fuel. The cheapest path between two circular orbits is a Hohmann transfer: one burn to leave, one to arrive. Farther planets cost more Δv and more days.</p><h4>Launch windows</h4><p>Planets keep moving while you wait. A Hohmann transfer only works when the target sits at the right angle ahead of (or behind) Earth, so real missions launch in short windows. Miss it and you pay extra fuel: in this game up to 60% more. Watch the 🎯 bar and launch when it turns green.</p><h4>Gravity</h4><p>Each world pulls differently (Moon 1.62, Earth 9.8, Jupiter 24.79 m/s²). This changes how hard a landing is.</p><h4>Why RTGs in deep space</h4><p>Sunlight fades as 1/r². At Jupiter (5.2 AU) solar panels get about 1/27 of Earth’s light, so far-away missions use RTGs (nuclear batteries).</p><h4>Radiation and shielding</h4><p>Space radiation damages electronics. Shielding absorbs it but adds mass, so engineers trade protection against payload.</p><h4>Thermal control</h4><p>From Venus (464 °C) to the Kuiper Belt (−225 °C), the heat shield and insulation decide whether the electronics survive.</p>`,
                        `<h4>Δv dan pemindahan Hohmann</h4><p>Δv ialah “perubahan laju” yang perlu dibeli roket dengan bahan api. Laluan paling jimat antara dua orbit bulat ialah pemindahan Hohmann: satu pembakaran untuk bertolak, satu lagi untuk tiba. Planet yang lebih jauh memerlukan lebih Δv dan lebih banyak hari.</p><h4>Graviti</h4><p>Setiap dunia menarik dengan kekuatan berbeza (Bulan 1.62, Bumi 9.8, Musytari 24.79 m/s²). Ini mengubah kesukaran mendarat.</p><h4>Mengapa RTG di angkasa jauh</h4><p>Cahaya Matahari melemah mengikut 1/r². Di Musytari (5.2 AU) panel solar hanya mendapat kira-kira 1/27 cahaya Bumi, maka misi jauh guna RTG (bateri nuklear).</p><h4>Radiasi dan perisai</h4><p>Radiasi angkasa merosakkan elektronik. Perisai menyerapnya tetapi menambah jisim, jadi jurutera menimbang perlindungan berbanding muatan.</p><h4>Kawalan haba</h4><p>Dari Zuhrah (464 °C) hingga Tali Kuiper (−225 °C), perisai haba dan penebat menentukan sama ada elektronik selamat.</p>`,
                        `<h4>Δv 与霍曼转移</h4><p>Δv 是火箭必须用燃料“购买”的速度变化。两个圆轨道之间最省燃料的路线是霍曼转移：一次点火出发，一次点火到达。越远的星球需要越多 Δv 和天数。</p><h4>重力</h4><p>每个世界的引力不同（月球 1.62、地球 9.8、木星 24.79 m/s²），会影响着陆难度。</p><h4>为什么深空用 RTG</h4><p>阳光按 1/r² 减弱。在木星（5.2 AU）太阳能板只能得到地球约 1/27 的光照，所以远程任务使用 RTG（核电池）。</p><h4>辐射与屏蔽</h4><p>太空辐射会损坏电子设备。屏蔽层能吸收辐射但会增加质量，工程师要在防护与载荷之间权衡。</p><h4>热控制</h4><p>从金星（464 °C）到柯伊伯带（−225 °C），隔热和保温决定电子设备能否存活。</p>`],
                    [`<p>This game uses free NASA resources:</p><ul><li><b>NASA Planetary Fact Sheet</b> – gravity, mean temperature, distance from the Sun and moon counts for every world. <a href="https://nssdc.gsfc.nasa.gov/planetary/factsheet/" target="_blank" rel="noopener">nssdc.gsfc.nasa.gov/planetary/factsheet</a></li><li><b>Real NASA missions</b> – each mission report names real spacecraft that visited that world: LRO, Artemis, Perseverance, MAVEN, Magellan, DAVINCI, Juno, Europa Clipper, Cassini, Voyager 1 &amp; 2 and New Horizons.</li><li><b>GMAT (NASA General Mission Analysis Tool)</b> – reports for teen and adult levels include a GMAT-style script template filled with your mission’s Δv and travel time.</li><li><b>NASA Mission Viz idea</b> – the orrery and the “scene graph &amp; numbers” table follow the Sun → planets → moons tree used in NASA’s mission visualization tools.</li><li><b>Real science stories</b> – rare discoveries such as Enceladus plumes and Europa ocean signals come from NASA mission findings.</li></ul><p class="m">Planet numbers are a snapshot; check NASA for current values.</p>`,
                        `<p>Permainan ini menggunakan sumber NASA percuma:</p><ul><li><b>NASA Planetary Fact Sheet</b> – graviti, suhu purata, jarak dari Matahari dan bilangan bulan bagi setiap dunia. <a href="https://nssdc.gsfc.nasa.gov/planetary/factsheet/" target="_blank" rel="noopener">nssdc.gsfc.nasa.gov/planetary/factsheet</a></li><li><b>Misi NASA sebenar</b> – setiap laporan misi menamakan kapal angkasa sebenar yang melawat dunia itu: LRO, Artemis, Perseverance, MAVEN, Magellan, DAVINCI, Juno, Europa Clipper, Cassini, Voyager 1 &amp; 2 dan New Horizons.</li><li><b>GMAT (NASA General Mission Analysis Tool)</b> – laporan tahap remaja dan dewasa mengandungi templat skrip gaya GMAT dengan Δv dan masa perjalanan misi anda.</li><li><b>Idea NASA Mission Viz</b> – orrery dan jadual “scene graph” mengikut pokok Matahari → planet → bulan seperti alat visualisasi misi NASA.</li><li><b>Kisah sains sebenar</b> – penemuan jarang seperti semburan Enceladus dan isyarat lautan Europa berasaskan penemuan misi NASA.</li></ul><p class="m">Nombor planet ialah syot kilat; semak NASA untuk nilai terkini.</p>`,
                        `<p>本游戏使用了免费的 NASA 资源：</p><ul><li><b>NASA Planetary Fact Sheet</b> – 每个星球的重力、平均温度、与太阳的距离和卫星数量。<a href="https://nssdc.gsfc.nasa.gov/planetary/factsheet/" target="_blank" rel="noopener">nssdc.gsfc.nasa.gov/planetary/factsheet</a></li><li><b>真实的 NASA 任务</b> – 每份任务报告都会列出到访过该星球的真实航天器：LRO、Artemis、Perseverance、MAVEN、Magellan、DAVINCI、Juno、Europa Clipper、Cassini、Voyager 1 &amp; 2 和 New Horizons。</li><li><b>GMAT（NASA 通用任务分析工具）</b> – 青少年和成人级别的报告包含 GMAT 风格的脚本模板，并填入你任务的 Δv 和飞行时间。</li><li><b>NASA Mission Viz 理念</b> – 轨道图和“场景图与数据”表格沿用 NASA 任务可视化工具的 太阳 → 行星 → 卫星 树状结构。</li><li><b>真实科学故事</b> – 土卫二羽流、木卫二海洋信号等罕见发现来自 NASA 任务成果。</li></ul><p class="m">星球数据为快照；最新数值请查阅 NASA。</p>`],
                    [`<h4>Real-world practicality</h4><ul><li>The maths is real: Hohmann transfer Δv and trip times are computed from planet distances, the same method mission designers use for first estimates.</li><li>Budget, risk and trade-offs mirror real design: more shielding means less payload and more cost.</li><li>It runs in any modern browser on phones, tablets and school PCs, with no install and no internet needed.</li></ul><h4>Commercial potential</h4><ul><li><b>Schools and tuition:</b> a licence per school or class for STEM lessons.</li><li><b>Expansion packs:</b> asteroid, Mars-colony and exoplanet missions.</li><li><b>Teacher tools:</b> class scoreboards and printable mission reports.</li><li><b>Museums and planetariums:</b> a kiosk or VR split-view exhibit.</li><li><b>Partnerships:</b> space agencies, universities and sponsors for events and competitions.</li></ul><p class="m">These are ideas for scaling up; they are not launched yet.</p>`,
                        `<h4>Kepraktisan dunia nyata</h4><ul><li>Matematiknya sebenar: Δv pemindahan Hohmann dan masa perjalanan dikira daripada jarak planet, kaedah yang sama digunakan pereka misi untuk anggaran awal.</li><li>Bajet, risiko dan tukar ganti meniru reka bentuk sebenar: lebih perisai bermakna kurang muatan dan lebih kos.</li><li>Berjalan pada pelayar moden di telefon, tablet dan PC sekolah, tanpa pemasangan dan tanpa internet.</li></ul><h4>Potensi komersial</h4><ul><li><b>Sekolah dan tuisyen:</b> lesen setiap sekolah atau kelas untuk pelajaran STEM.</li><li><b>Pek tambahan:</b> misi asteroid, koloni Marikh dan eksoplanet.</li><li><b>Alat guru:</b> papan skor kelas dan laporan misi boleh cetak.</li><li><b>Muzium dan planetarium:</b> pameran kiosk atau VR paparan dua.</li><li><b>Kerjasama:</b> agensi angkasa, universiti dan penaja untuk acara dan pertandingan.</li></ul><p class="m">Ini idea untuk berkembang; belum dilancarkan.</p>`,
                        `<h4>现实可行性</h4><ul><li>数学是真实的：霍曼转移 Δv 和飞行时间由行星距离计算，这是任务设计师做初步估算的同样方法。</li><li>预算、风险与取舍模拟真实设计：屏蔽越多，载荷越少、成本越高。</li><li>可在手机、平板和学校电脑的现代浏览器中运行，无需安装也无需联网。</li></ul><h4>商业潜力</h4><ul><li><b>学校与补习：</b>按学校或班级授权用于 STEM 课程。</li><li><b>扩展包：</b>小行星、火星殖民地和系外行星任务。</li><li><b>教师工具：</b>班级排行榜和可打印的任务报告。</li><li><b>博物馆与天文馆：</b>展台或 VR 分屏展览。</li><li><b>合作：</b>与航天机构、大学和赞助商合作举办活动和比赛。</li></ul><p class="m">这些是扩展想法，尚未推出。</p>`]

            const SP = { tin: 0, on: 1, t: [] };
            function noise(d, v, f0, f1) { if (!AC || !S.sfx)
                return; const n = AC.sampleRate * d | 0, b = AC.createBuffer(1, n, AC.sampleRate), a = b.getChannelData(0); for (let i = 0; i < n; i++)
                a[i] = Math.random() * 2 - 1; const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), T = AC.currentTime; s.buffer = b; f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(f0, T); f.frequency.exponentialRampToValueAtTime(f1, T + d); g.gain.setValueAtTime(.0001, T); g.gain.exponentialRampToValueAtTime(v, T + d * .8); g.gain.exponentialRampToValueAtTime(.0001, T + d); s.connect(f); f.connect(g); g.connect(mg); s.start(T); }
            const mus = (f, d, ty, v, f2) => { if (S.music)
                tone(f, d, ty, v, f2); };
            const spT = (f, ms) => SP.t.push(setTimeout(f, ms));
            function spStart() {
                if (!SP.on || $('sp').classList.contains('go'))
                    return;
                au();
                const sp = $('sp');
                sp.classList.add('go');
                const k = $('spk');
                for (let i = 0; i < 40; i++) {
                    const a = Math.random() * 6.283, r = 120 + Math.random() * Math.min(innerWidth, innerHeight) * .5, s = document.createElement('span');
                    s.className = 'spk';
                    s.style.cssText = '--dx:' + Math.cos(a) * r + 'px;--dy:' + Math.sin(a) * r + 'px;background:' + ['#ffcc00', '#fff', '#e0262d', '#6f8cff'][i % 4] + ';animation-delay:' + (.9 + Math.random() * .1) + 's';
                    k.appendChild(s);
                }
                // riser
                sfx(120, .9, 'sawtooth', .07, 900);
                noise(.9, .22, 300, 4500);
                // impact
                spT(() => {
                    sfx(110, .9, 'sine', .35, 38);
                    noise(.55, .3, 2500, 180);
                    [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => sfx(f, .7, 'sine', .12), i * 90));
                    [262, 330, 392, 523].forEach(f => mus(f, 2.4, 'triangle', .07));
                }, 900);
                // jingle
                spT(() => [523, 659, 784, 988, 1047, 784, 1047, 1319].forEach((f, i) => setTimeout(() => mus(f, .35, 'square', .05), i * 160)), 1900);
                spT(spEnd, 4800);
            }
            function spEnd() {
                if (!SP.on)
                    return;
                SP.on = 0;
                SP.t.forEach(clearTimeout);
                const sp = $('sp');
                noise(.7, .25, 400, 7000);
                sfx(300, .6, 'sawtooth', .06, 1400);
                [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => setTimeout(() => { mus(f, .9, 'triangle', .09); sfx(f * 2, .25, 'sine', .04); }, 250 + i * 90));
                SP.tin = 1;
                render();
                sp.classList.add('out');
                setTimeout(() => sp.remove(), 650);
            }
            $('spg').onclick = spStart;
            $('sps').onclick = e => { e.stopPropagation(); if (!SP.on)
                return; au(); spEnd(); };
            document.addEventListener('keydown', e => { if (SP.on && (e.key == 'Enter' || e.key == ' ')) {
                e.preventDefault();
                $('sp').classList.contains('go') ? 0 : spStart();
            } });
            render();
        </script>
